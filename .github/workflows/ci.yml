name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: high-availability-app:test

      - name: Run container
        run: |
          docker run -d --name test-app -p 8081:80 high-availability-app:test
          sleep 3

      - name: Test application
        run: |
          curl --fail http://localhost:8081 | grep "Hello from Dockerized Application"

      - name: Stop container
        if: always()
        run: docker rm -f test-app
