name: CI-CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          push: false
          tags: high-availability-app:test

      - name: Run test container
        run: |
          docker run -d \
            --name test-app \
            -p 8081:80 \
            high-availability-app:test

          sleep 3

      - name: Test application
        run: |
          curl --fail http://localhost:8081 | grep "Hello from Dockerized Application"

      - name: Remove test container
        if: always()
        run: docker rm -f test-app

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/asthak-2505/high-availability-app:latest
            ghcr.io/asthak-2505/high-availability-app:${{ github.sha }}

  deploy:
    needs: build-test-publish
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy application
        run: ./scripts/deploy-local.sh
